# Instaladores do Rawly para Mac, Windows e Linux.
#
# Este repositório é o espelho público da pasta `desktop/` do Rawly: é público
# porque o GitHub Actions só é gratuito (inclusive nos runners de macOS) em
# repositório público, e a casca não tem segredo nenhum — só abre o site.
#
# Roda ao empurrar uma tag `vX.Y.Z` (a versão de `package.json` tem que ser a
# mesma) ou à mão. Os instaladores ficam sempre anexados ao workflow. Com os
# secrets R2_* (os mesmos nomes do Doppler), cada sistema também sobe os seus
# instaladores e o seu `latest*.yml` para o bucket, no prefixo
# `downloads/desktop/`, de onde o site serve o download direto
# (`https://rawly-ten.vercel.app/downloads/desktop/<nome>`) e o app instalado
# se atualiza sozinho. Nada passa pelo GitHub Releases.
name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Subir para o R2 (sobrescreve os downloads no ar)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Conferir que a tag bate com a versão
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com package.json ($version)"
            exit 1
          fi

      - run: npm ci

      - name: Empacotar para Mac (dmg e zip, arm64 e x64)
        if: matrix.target == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          notarize=false
          if [ -z "$CSC_LINK" ]; then
            echo "Sem certificado: o app do Mac sai sem assinatura (Gatekeeper vai avisar)."
            # Vazia, a variável ainda conta como "definida" para o electron-builder, que tenta
            # abrir o caminho "" como certificado e falha com "not a file".
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          elif [ -n "$APPLE_ID" ]; then
            notarize=true
          fi
          npm run compile
          # O binário do koffi (controle remoto) das duas arquiteturas, não só a do runner.
          node scripts/koffi-mac.mjs
          npx electron-builder --mac --publish never -c.mac.notarize=$notarize

      - name: Empacotar para Windows (instalador x64)
        if: matrix.target == 'win'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "Sem certificado: o instalador do Windows sai sem assinatura (SmartScreen vai avisar)."
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npm run compile
          npx electron-builder --win --publish never

      - name: Empacotar para Linux (AppImage, deb e rpm x64)
        if: matrix.target == 'linux'
        run: |
          # O fpm gera o .rpm com a ferramenta `rpm`, que o runner do Ubuntu não traz.
          sudo apt-get update -q && sudo apt-get install -y -q rpm
          npm run compile
          npx electron-builder --linux --publish never

      - name: Guardar os instaladores no workflow
        uses: actions/upload-artifact@v4
        with:
          name: rawly-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/latest*.yml

      - name: Subir para o R2 (downloads/desktop/)
        if: github.ref_type == 'tag' || inputs.publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # O R2 fala S3, mas não aceita os checksums CRC que o aws-cli novo manda por padrão.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "::notice::Sem os secrets R2_*: os instaladores ficam só nos artefatos deste workflow."
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          prefix="s3://$R2_BUCKET/downloads/desktop"
          shopt -s nullglob
          # Primeiro os instaladores, por último os `latest*.yml`: quem checa atualização só vê a
          # versão nova depois de os arquivos dela já estarem no ar.
          for file in dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb dist/*.rpm dist/*.blockmap; do
            echo "subindo $(basename "$file")"
            aws s3 cp "$file" "$prefix/$(basename "$file")" --endpoint-url "$endpoint" \
              --content-type application/octet-stream --cache-control "public, max-age=300" --only-show-errors
          done
          for file in dist/latest*.yml; do
            echo "subindo $(basename "$file")"
            aws s3 cp "$file" "$prefix/$(basename "$file")" --endpoint-url "$endpoint" \
              --content-type text/yaml --cache-control no-cache --only-show-errors
          done
          echo "no ar em https://rawly-ten.vercel.app/downloads/desktop/"
