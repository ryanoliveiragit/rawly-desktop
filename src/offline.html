<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
<title>Sem conexão · Rawly</title>
<style>
	:root { color-scheme: dark; }
	body {
		margin: 0; min-height: 100vh; display: grid; place-items: center;
		background: #17171a; color: #f2f2f3;
		font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		user-select: none;
	}
	main { max-width: 28rem; padding: 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
	.mark { display: flex; align-items: flex-end; gap: 5px; height: 36px; margin-bottom: 6px; }
	.mark span { width: 7px; border-radius: 4px; }
	.mark span:nth-child(1) { height: 22px; background: #ff7a29; }
	.mark span:nth-child(2) { height: 36px; background: linear-gradient(180deg, #ff7a29, #944bc2); }
	.mark span:nth-child(3) { height: 28px; background: #944bc2; }
	h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
	p { margin: 0; color: #8e8e98; }
	button {
		margin-top: 8px; border: 0; border-radius: 10px; height: 38px; padding: 0 18px;
		background: #ff7a29; color: #2a0d00; font: inherit; font-weight: 600; cursor: default;
	}
	button:hover { background: #ff9352; }
	button:focus-visible { outline: 2px solid #ff7a29; outline-offset: 2px; }
	small { color: #5a5a62; font-size: 12px; }
</style>
</head>
<body>
	<main>
		<div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
		<h1>Sem conexão com o Rawly</h1>
		<p id="detail">Confira a internet. Assim que a conexão voltar, o app tenta de novo sozinho.</p>
		<button type="button" id="retry">Tentar de novo</button>
		<small id="code"></small>
	</main>
	<script src="offline.js"></script>
</body>
</html>
