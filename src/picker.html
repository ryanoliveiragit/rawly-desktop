<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'" />
<title>Compartilhar tela</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	body {
		margin: 0; height: 100vh; display: flex; flex-direction: column;
		background: #17171a; color: #f2f2f3;
		font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		user-select: none;
	}
	header { display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px; }
	h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
	.tabs { display: flex; gap: 4px; margin-left: auto; background: #1c1c20; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 3px; }
	.tab { border: 0; background: transparent; color: #a5a5ae; font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; cursor: default; }
	.tab[aria-selected="true"] { background: #2a2a30; color: #f2f2f3; }
	main { flex: 1; overflow: auto; padding: 4px 18px 12px; }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
	.card {
		display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 12px;
		background: #1c1c20; border: 2px solid transparent; outline: 1px solid rgba(255,255,255,.07); outline-offset: -1px;
		cursor: default; text-align: left; color: inherit; font: inherit;
	}
	.card:hover { background: #232328; }
	.card[aria-pressed="true"] { border-color: #ff7a29; outline-color: transparent; }
	.thumb { aspect-ratio: 16 / 9; width: 100%; border-radius: 8px; background: #0f0f10; object-fit: contain; display: block; }
	.thumb.empty { display: grid; place-items: center; color: #5a5a62; font-size: 12px; }
	.name { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12.5px; color: #e3e3e6; }
	.name img { width: 16px; height: 16px; border-radius: 3px; flex: none; }
	.name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.empty-state { color: #8e8e98; padding: 40px 0; text-align: center; }
	footer { display: flex; align-items: center; gap: 12px; padding: 12px 18px 16px; border-top: 1px solid rgba(255,255,255,.07); }
	label.audio { display: none; align-items: center; gap: 8px; color: #b8b8c0; font-size: 13px; }
	label.audio[data-on="true"] { display: inline-flex; }
	.spacer { flex: 1; }
	button.action { border: 0; border-radius: 10px; height: 34px; padding: 0 14px; font: inherit; font-weight: 500; cursor: default; }
	button.secondary { background: transparent; color: #e3e3e6; border: 1px solid rgba(255,255,255,.1); }
	button.secondary:hover { background: #232328; }
	button.primary { background: #ff7a29; color: #2a0d00; font-weight: 600; }
	button.primary:hover { background: #ff9352; }
	button.primary:disabled { background: #2a2a30; color: #8e8e98; }
	button:focus-visible, .card:focus-visible { outline: 2px solid #ff7a29; outline-offset: 2px; }
</style>
</head>
<body>
	<header>
		<h1>O que você quer compartilhar?</h1>
		<div class="tabs" role="tablist">
			<button class="tab" role="tab" data-kind="screen" aria-selected="true">Telas</button>
			<button class="tab" role="tab" data-kind="window" aria-selected="false">Janelas</button>
		</div>
	</header>
	<main>
		<div class="grid" id="grid" role="listbox" aria-label="Fontes"></div>
	</main>
	<footer>
		<label class="audio" id="audio-label"><input type="checkbox" id="audio" /> Compartilhar o áudio do sistema</label>
		<span class="spacer"></span>
		<button class="action secondary" id="cancel" type="button">Cancelar</button>
		<button class="action primary" id="share" type="button" disabled>Compartilhar</button>
	</footer>
	<script src="picker.js"></script>
</body>
</html>
