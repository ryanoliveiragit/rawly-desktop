<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
<title>Controle remoto</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0; background: transparent; color: #f2f2f3;
		font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		user-select: none; overflow: hidden;
	}
	.bar {
		height: 100%; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px;
		background: #1c1c20; border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
		-webkit-app-region: drag;
	}
	.solid body { background: #1c1c20; }
	.solid .bar { border: 0; border-radius: 0; }
	.dot {
		flex: none; width: 8px; height: 8px; border-radius: 50%; background: #ff7a29;
		box-shadow: 0 0 0 0 rgba(255,122,41,.55); animation: pulse 1.8s ease-out infinite;
	}
	@keyframes pulse { to { box-shadow: 0 0 0 7px rgba(255,122,41,0); } }
	/* Nome comprido encurta o nome, nunca o aviso. */
	.text { flex: 1; min-width: 0; margin: 0; display: flex; color: #b8b8c0; white-space: pre; }
	.text strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #f2f2f3; font-weight: 600; }
	.text span { flex: none; }
	kbd {
		flex: none; font: 11px/1 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		color: #8e8e98; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 4px 6px; white-space: nowrap;
	}
	button {
		flex: none; -webkit-app-region: no-drag; height: 32px; padding: 0 14px; border: 0; border-radius: 7px;
		background: #ff7a29; color: #2a0d00; font: inherit; font-weight: 600; cursor: default;
	}
	button:hover { background: #ff9352; }
	button:focus-visible { outline: 2px solid #ff7a29; outline-offset: 2px; }
	@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
	<div class="bar" role="status">
		<span class="dot" aria-hidden="true"></span>
		<p class="text"><strong id="name"></strong><span> está controlando sua tela</span></p>
		<kbd id="shortcut"></kbd>
		<button id="stop" type="button">Parar</button>
	</div>
	<script src="overlay.js"></script>
</body>
</html>
